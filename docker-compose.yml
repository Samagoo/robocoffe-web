# RoboCoffee platform — single Windows PC (Docker Desktop).
# The robot subsystem (robot/) and the scale bridge (scale_bridge/) run NATIVELY on Windows,
# not here: they need WiFi to the OAK9 and the Bluetooth COM port, which containers can't open.
name: robocoffee

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WATCHFILES_FORCE_POLLING: "true"   # hot reload works with Windows bind mounts
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./backend/migrations:/code/migrations   # new migration files appear on the host
      - ./backend/tests:/code/tests
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach main_real.py (:9000) on the Windows host
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  pgdata:
